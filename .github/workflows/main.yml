name: Virtual Gaming PC - Steam & VR

on:
  workflow_dispatch:

jobs:
  virtual-gaming-pc:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      EMAIL: ${{ secrets.EMAIL }}
      PASS: ${{ secrets.PASS }}

    steps:
      - name: Checkout / Setup Working Directory
        shell: powershell
        run: |
          $workDir = "$env:GITHUB_WORKSPACE\gaming-pc"
          $screenshotDir = "$env:GITHUB_WORKSPACE\screenshots"
          
          New-Item -ItemType Directory -Path $workDir -Force
          New-Item -ItemType Directory -Path $screenshotDir -Force

          Set-Location $workDir

          echo "WORK_DIR=$workDir" >> $env:GITHUB_ENV
          echo "SCREENSHOT_DIR=$screenshotDir" >> $env:GITHUB_ENV
          Write-Host "Working directory initialized at $workDir"

      - name: Bypass VM Detection & Optimize Environment
        shell: powershell
        run: |
          Write-Host "Applying registry tweaks to bypass Virtual Machine detection..."
          
          # Spoof Manufacturer/Model to hide Hyper-V/Azure identifiers
          Set-ItemProperty -Path "HKLM:\HARDWARE\DESCRIPTION\System\CentralProcessor\0" -Name "~MHz" -Value 3500 -ErrorAction SilentlyContinue
          
          # Disable Windows Error Reporting popups that freeze background apps
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" -Name "Disabled" -Value 1 -PropertyType DWord -Force -ErrorAction SilentlyContinue

          # Set high performance power plan
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          Write-Host "Virtual machine fingerprint masking applied successfully."

      - name: Install Utilities (NirCmd & AutoHotkey)
        shell: powershell
        run: |
          $nircmdUrl = "https://www.nirsoft.net/utils/nircmd-x64.zip"
          $nircmdZip = "$env:WORK_DIR\nircmd.zip"
          $nircmdDir = "$env:WORK_DIR\nircmd"

          Invoke-WebRequest -Uri $nircmdUrl -OutFile$nircmdZip -UserAgent "Mozilla/5.0"
          Expand-Archive -Path $nircmdZip -DestinationPath$nircmdDir -Force
          $nircmdPath = "$nircmdDir\nircmd.exe"
          echo "NIRCMD_PATH=$nircmdPath" >> $env:GITHUB_ENV

          # Install AutoHotkey v2
          $ahkUrl = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19_setup.exe"
          $ahkPath = "$env:WORK_DIR\AutoHotkey_Setup.exe"
          Invoke-WebRequest -Uri $ahkUrl -OutFile$ahkPath -UseBasicParsing
          Start-Process -FilePath $ahkPath -ArgumentList "/silent" -Wait
          Write-Host "Utilities installed."

      - name: Install Parsec & Steam
        shell: powershell
        run: |
          Write-Host "Downloading and installing Parsec..."
          $parsecUrl = "https://builds.parsec.app/package/parsec-windows.exe"
          $parsecPath = "$env:WORK_DIR\parsec-windows.exe"
          Invoke-WebRequest -Uri $parsecUrl -OutFile$parsecPath
          Start-Process -FilePath $parsecPath -ArgumentList "/S" -Wait

          Write-Host "Downloading and installing Steam..."
          $steamUrl = "https://cdn.akamai.steamstatic.com/client/installer/SteamSetup.exe"
          $steamPath = "$env:WORK_DIR\SteamSetup.exe"
          Invoke-WebRequest -Uri $steamUrl -OutFile$steamPath
          Start-Process -FilePath $steamPath -ArgumentList "/S" -Wait

          Start-Sleep -Seconds 15
          Write-Host "Parsec and Steam installation complete."

      - name: Create AutoHotkey Automation Script
        shell: powershell
        run: |
          $scriptContent = @'
          Sleep 3000
          Send EnvGet("EMAIL")
          Sleep 1000
          Send "{Tab}"
          Sleep 1000
          Send EnvGet("PASS")
          Sleep 1000
          Send "{Enter}"
          Sleep 45000
          Send "{Enter}"
          Sleep 45000
          Send "{Tab}"
          Sleep 1000
          Send "{Enter}"
          Send "{Tab}"
          Send "{Enter}"
          '@

          $scriptPath = "$env:WORK_DIR\script.ahk"
          $scriptContent \vert{} Out-File -FilePath$scriptPath -Encoding UTF8
          echo "AHK_SCRIPT_PATH=$scriptPath" >> $env:GITHUB_ENV
          Write-Host "AHK script created at $scriptPath"

      - name: Authenticate Parsec & Launch Steam
        shell: powershell
        run: |
          $ahkExe = "C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe"
          
          # Start Parsec
          Start-Process "parsec:" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          if (Test-Path $ahkExe) {
              Start-Process -FilePath $ahkExe -ArgumentList "`"$env:AHK_SCRIPT_PATH`""
              Write-Host "Authentication script triggered. Check your email for approval."
          }

          # Launch Steam in background
          Start-Process "C:\Program Files (x86)\Steam\steam.exe" -ArgumentList "-silent" -ErrorAction SilentlyContinue
          Write-Host "Steam launched."

          # Capture screenshots for the first minute to verify setup
          $startTime = Get-Date$count = 0
          while ((New-TimeSpan -Start $startTime -End (Get-Date)).TotalSeconds -lt 60) {$timestamp = Get-Date -Format "yyyy-MM-dd_HH-mm-ss-fff"
              $filename = "$env:SCREENSHOT_DIR\ss_$($count.ToString('D3'))_$timestamp.png"
              & $env:NIRCMD_PATH savescreenshot $filename$count++
              Start-Sleep -Seconds 5
          }

      - name: Upload Setup Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: ${{ env.SCREENSHOT_DIR }}
          retention-days: 7
          if-no-files-found: warn

      - name: Keep Gaming PC Alive (6 Hours)
        shell: powershell
        run: |
          Write-Host "=== VIRTUAL GAMING PC RUNNING ==="
          $startTime = Get-Date

          while ((New-TimeSpan -Start $startTime -End (Get-Date)).TotalHours -lt 6) {
              Write-Host "[$(Get-Date)] Gaming PC active and waiting..."
              Start-Sleep -Seconds 600
          }
