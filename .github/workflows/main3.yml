name: VR Gaming PC

on:
  workflow_dispatch:

jobs:
  steamvr-setup:
    runs-on: self-hosted   # your own Windows PC with an NVIDIA GPU
    timeout-minutes: 720

    env:
      STEAM_USER: ${{ secrets.STEAM_USER }}
      STEAM_PASS: ${{ secrets.STEAM_PASS }}

    steps:
      # Verify GPU is present — fails fast instead of wasting hours
      - name: Check NVIDIA GPU
        shell: powershell
        run: |
          $gpu = Get-WmiObject Win32_VideoController | Where-Object { $_.Name -match "NVIDIA" }
          if (-not $gpu) {
            Write-Error "No NVIDIA GPU detected. This machine cannot run SteamVR."
            exit 1
          }
          nvidia-smi
          Write-Host "GPU OK: $($gpu.Name)"

      # Latest driver via winget (chocolatey is another option)
      - name: Update NVIDIA driver
        shell: powershell
        run: |
          winget install --id Nvidia.GeForceExperience --accept-source-agreements --accept-package-agreements -h --force
          # Or driver-only (no GFE bloat):
          winget install --id Nvidia.Driver --accept-source-agreements --accept-package-agreements -h --force

      - name: Install Steam
        shell: powershell
        run: |
          winget install --id Valve.Steam --accept-source-agreements --accept-package-agreements -h --force
          # Steam installs to C:\Program Files (x86)\Steam by default

      - name: Install SteamVR and VRChat
        shell: powershell
        run: |
          # Steam must run once to accept EULA and establish config
          $steamExe = "C:\Program Files (x86)\Steam\steam.exe"
          Start-Process $steamExe -ArgumentList "-silent"
          Start-Sleep -Seconds 45

          # Use steamcmd for headless installs — no AHK credential-typing needed
          winget install --id Valve.SteamCMD -h --force
          $steamcmd = "C:\steamcmd\steamcmd.exe"

          # Login with your credentials (app 250820 = SteamVR, app 438100 = VRChat)
          & $steamcmd +login $env:STEAM_USER $env:STEAM_PASS +app_update 250820 validate +app_update 438100 validate +quit

          # Guard: VRChat requires +login, can't fully install anonymous
          Write-Host "SteamVR and VRChat installed/validated"

      - name: Install Parsec
        shell: powershell
        run: |
          winget install --id Parsec.Parsec -h --force

      - name: Launch SteamVR
        shell: powershell
        run: |
          $steamExe = "C:\Program Files (x86)\Steam\steam.exe"
          Start-Process $steamExe -ArgumentList "-applaunch 250820"
          Start-Sleep -Seconds 60
          Write-Host "SteamVR launched — connect via Parsec / Virtual Desktop"

      - name: Keep session alive
        shell: powershell
        run: |
          $start = Get-Date
          while ((New-TimeSpan -Start $start -End (Get-Date)).TotalHours -lt 12) {
            # Touch the runner so it doesn't idle-sleep mid-session
            (New-Object -ComObject WScript.Shell).SendKeys('{F15}')
            Write-Host "[$(Get-Date)] Session alive"
            Start-Sleep -Seconds 300
          }
