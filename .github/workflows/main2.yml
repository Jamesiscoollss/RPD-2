<#.SYNOPSIS    Configures a Windows GPU machine as a cloud gaming PC..DESCRIPTION    Designed to run from GitHub Actions on a self-hosted Windows runner with a    working NVIDIA GPU, but it can also be run manually as Administrator.    Parsec sign-in is automated through Parsec for Teams provisioning:    Team ID + Team Computer Key. This avoids GUI automation, screenshots, and    storing a personal Parsec password..EXAMPLE    .\Cloud-Gaming-PC-Setup.ps1 -RequireGpu `        -ParsecTeamId $env:PARSEC_TEAM_ID `        -ParsecTeamComputerKey $env:PARSEC_TEAM_COMPUTER_KEY `        -ParsecUserEmail $env:PARSEC_USER_EMAIL.EXAMPLE    $autoPassword = Read-Host "Windows auto-login password" -AsSecureString    .\Cloud-Gaming-PC-Setup.ps1 -AutoLoginUser "Gaming" -AutoLoginPass $autoPassword#>[CmdletBinding()]param(    [string]$AutoLoginUser = "",    [SecureString]$AutoLoginPass,    # Set to 0 to disable the idle-shutdown watchdog.    [ValidateRange(0, 1440)]    [int]$IdleShutdownMinutes = 30,    # Fail instead of continuing when no working NVIDIA GPU is found.    [switch]$RequireGpu,    [switch]$SkipSteam,    # Parsec for Teams provisioning. Team ID and Computer Key must be used together.    [string]$ParsecTeamId = "",    [string]$ParsecTeamComputerKey = "",    # Optional Parsec assignment. Use only one of email, user ID, or group ID.    [string]$ParsecUserEmail = "",    [ValidateRange(0, 2147483647)]    [int]$ParsecUserId = 0,    [ValidateRange(0, 2147483647)]    [int]$ParsecTeamGroupId = 0,    [ValidateSet("0", "1")]    [string]$ParsecGuestAccess = "0",    [string]$ParsecDownloadUrl = "https://builds.parsec.app/package/parsec-windows.exe",    [string]$SteamDownloadUrl = "https://cdn.akamai.steamstatic.com/client/installer/SteamSetup.exe")Set-StrictMode -Version Latest$ErrorActionPreference = "Stop"$script:LogFile = "C:\cloudgaming-setup.log"$script:TranscriptStarted = $false$script:ProtectedValues = New-Object 'System.Collections.Generic.HashSet[string]'function Write-Step {    param([Parameter(Mandatory = $true)][string]$Message)    Write-Host ""    Write-Host "==== $Message ====" -ForegroundColor Cyan}function Protect-SensitiveValue {    param([AllowNull()][AllowEmptyString()][string]$Value)    if ([string]::IsNullOrWhiteSpace($Value)) { return }    if (-not $script:ProtectedValues.Add($Value)) { return }    if ($env:GITHUB_ACTIONS -eq "true") {        Write-Host "::add-mask::$Value"    }}function Test-IsAdministrator {    $identity = [Security.Principal.WindowsIdentity]::GetCurrent()    $principal = [Security.Principal.WindowsPrincipal]::new($identity)    return $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)}function Get-NvidiaSmiPath {    $command = Get-Command "nvidia-smi.exe" -ErrorAction SilentlyContinue    if ($command) { return $command.Source }    $defaultPath = "C:\Program Files\NVIDIA Corporation\NVSMI\nvidia-smi.exe"    if (Test-Path -LiteralPath $defaultPath) { return $defaultPath }    return $null}function Invoke-Download {    param(        [Parameter(Mandatory = $true)][string]$Uri,        [Parameter(Mandatory = $true)][string]$Destination    )    $lastError = $null    foreach ($attempt in 1..3) {        try {            Write-Host "Downloading $Uri (attempt $attempt of 3)"            Invoke-WebRequest -Uri $Uri -OutFile $Destination -UseBasicParsing            if ((Get-Item -LiteralPath $Destination).Length -gt 0) { return }            throw "Downloaded file is empty: $Destination"        }        catch {            $lastError = $_            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }        }    }    throw "Download failed after 3 attempts: $Uri. $($lastError.Exception.Message)"}function Invoke-Installer {    param(        [Parameter(Mandatory = $true)][string]$Path,        [Parameter(Mandatory = $true)][string[]]$Arguments    )    $process = Start-Process -FilePath $Path -ArgumentList $Arguments -Wait -PassThru    if ($process.ExitCode -ne 0) {        throw "Installer failed with exit code $($process.ExitCode): $Path"    }}function Set-ParsecConfigValue {    param(        [Parameter(Mandatory = $true)][string]$Path,        [Parameter(Mandatory = $true)][string]$Key,        [Parameter(Mandatory = $true)][string]$Value    )    $lines = @()    if (Test-Path -LiteralPath $Path) {        $lines = @(Get-Content -LiteralPath $Path -ErrorAction SilentlyContinue)    }    $escapedKey = [regex]::Escape($Key)    $updated = $false    for ($index = 0; $index -lt $lines.Count; $index++) {        if ($lines[$index] -match "^\s*$escapedKey\s*=") {            $lines[$index] = "$Key = $Value"            $updated = $true        }    }    if (-not $updated) {        $lines += "$Key = $Value"    }    $lines | Set-Content -LiteralPath $Path -Encoding ASCII}try {    Start-Transcript -Path $script:LogFile -Append | Out-Null    $script:TranscriptStarted = $true    Write-Step "Checking administrator rights"    if (-not (Test-IsAdministrator)) {        throw "Run this script as Administrator, or run the GitHub self-hosted runner with administrative privileges."    }    Write-Step "Checking NVIDIA GPU and driver"    $nvidiaSmi = Get-NvidiaSmiPath    if ($nvidiaSmi) {        Write-Host "NVIDIA driver detected:"        & $nvidiaSmi --query-gpu=name,driver_version --format=csv,noheader | ForEach-Object {            Write-Host "  $_"        }        if ($LASTEXITCODE -ne 0) {            if ($RequireGpu) { throw "nvidia-smi was found but returned exit code $LASTEXITCODE." }            Write-Host "WARNING: nvidia-smi failed; continuing because -RequireGpu was not supplied." -ForegroundColor Yellow        }    }    else {        $message = @"No working NVIDIA driver was detected.For Azure GPU VMs, install the Microsoft NVIDIA GPU Driver Extension first, waitfor installation to finish, reboot, and then run this script again. Examples:  NVadsA10v5 / A10: NVIDIA GPU Driver Extension for Windows  NCasT4v3  / T4 : NVIDIA GPU Driver Extension for Windows"@        if ($RequireGpu) { throw $message }        Write-Host $message -ForegroundColor Yellow        Write-Host "Continuing without a GPU check because -RequireGpu was not supplied." -ForegroundColor Yellow    }    Write-Step "Applying power, display, and Windows Update settings"    powercfg /duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 | Out-Null    $ultimatePlan = powercfg /list | Select-String -Pattern "Ultimate Performance" | Select-Object -First 1    if ($ultimatePlan -and $ultimatePlan.Line -match "([0-9a-fA-F-]{36})") {        powercfg /setactive $Matches[1] | Out-Null    }    else {        powercfg /setactive SCHEME_MIN | Out-Null    }    powercfg /change monitor-timeout-ac 0 | Out-Null    powercfg /change standby-timeout-ac 0 | Out-Null    powercfg /change hibernate-timeout-ac 0 | Out-Null    New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization" -Force | Out-Null    Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization" -Name "NoLockScreen" -Value 1    New-Item -Path "HKCU:\Control Panel\Desktop" -Force | Out-Null    Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "ScreenSaveActive" -Value "0"    Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "ScreenSaveTimeOut" -Value "0"    New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" -Force | Out-Null    Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU" -Name "NoAutoRebootWithLoggedOnUsers" -Value 1    New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Force | Out-Null    Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" -Name "MaxIdleTime" -Value 0    Write-Host "Power and display settings applied."    Write-Step "Validating Parsec provisioning settings"    Protect-SensitiveValue $ParsecTeamId    Protect-SensitiveValue $ParsecTeamComputerKey    Protect-SensitiveValue $ParsecUserEmail    $hasTeamId = -not [string]::IsNullOrWhiteSpace($ParsecTeamId)    $hasTeamKey = -not [string]::IsNullOrWhiteSpace($ParsecTeamComputerKey)    if ($hasTeamId -ne $hasTeamKey) {        throw "ParsecTeamId and ParsecTeamComputerKey must be supplied together."    }    $assignmentCount = 0    if (-not [string]::IsNullOrWhiteSpace($ParsecUserEmail)) { $assignmentCount++ }    if ($ParsecUserId -gt 0) { $assignmentCount++ }    if ($ParsecTeamGroupId -gt 0) { $assignmentCount++ }    if ($assignmentCount -gt 1) {        throw "Choose only one Parsec assignment: user email, user ID, or team group ID."    }    $provisionParsec = $hasTeamId -and $hasTeamKey    Write-Step "Installing and provisioning Parsec"    $parsecExe = "C:\Program Files\Parsec\parsecd.exe"    $parsecAlreadyInstalled = Test-Path -LiteralPath $parsecExe    if ($parsecAlreadyInstalled -and -not $provisionParsec) {        Write-Host "Parsec is already installed; skipping installer."    }    else {        $parsecInstaller = Join-Path $env:TEMP "parsec-windows.exe"        Invoke-Download -Uri $ParsecDownloadUrl -Destination $parsecInstaller        $parsecArguments = [System.Collections.Generic.List[string]]::new()        [void]$parsecArguments.Add("/silent")        [void]$parsecArguments.Add("/shared")        if ($provisionParsec) {            [void]$parsecArguments.Add("/team_id=$ParsecTeamId")            [void]$parsecArguments.Add("/team_computer_key=$ParsecTeamComputerKey")            [void]$parsecArguments.Add("/guest_access=$ParsecGuestAccess")            if (-not [string]::IsNullOrWhiteSpace($ParsecUserEmail)) {                [void]$parsecArguments.Add("/user_email=$ParsecUserEmail")            }            elseif ($ParsecUserId -gt 0) {                [void]$parsecArguments.Add("/user_id=$ParsecUserId")            }            elseif ($ParsecTeamGroupId -gt 0) {                [void]$parsecArguments.Add("/team_group_id=$ParsecTeamGroupId")            }        }        Invoke-Installer -Path $parsecInstaller -Arguments $parsecArguments.ToArray()        Start-Sleep -Seconds 15    }    $serviceDeadline = (Get-Date).AddMinutes(2)    $parsecService = $null    while ((Get-Date) -lt $serviceDeadline) {        $parsecService = Get-Service -Name "Parsec" -ErrorAction SilentlyContinue        if ($parsecService) { break }        Start-Sleep -Seconds 5    }    if ($parsecService) {        Set-Service -Name "Parsec" -StartupType Automatic        if ($parsecService.Status -ne "Running") {            Start-Service -Name "Parsec"            $parsecService.WaitForStatus("Running", (New-TimeSpan -Minutes 1))        }        Write-Host "Parsec service is configured for automatic startup."    }    elseif ($provisionParsec) {        throw "Parsec service was not found within 2 minutes after Team provisioning."    }    else {        Write-Host "WARNING: Parsec service was not found immediately after installation." -ForegroundColor Yellow    }    $parsecDataDirectory = "C:\ProgramData\Parsec"    New-Item -ItemType Directory -Path $parsecDataDirectory -Force | Out-Null    $parsecConfig = Join-Path $parsecDataDirectory "config.txt"    if (-not (Test-Path -LiteralPath $parsecConfig)) {        New-Item -ItemType File -Path $parsecConfig -Force | Out-Null    }    Set-ParsecConfigValue -Path $parsecConfig -Key "network_server_start_port" -Value "8000"    Write-Host "Parsec host port configured: UDP 8000-8010."    if ($parsecService) {        Restart-Service -Name "Parsec" -Force        $parsecService = Get-Service -Name "Parsec"        $parsecService.WaitForStatus("Running", (New-TimeSpan -Minutes 1))    }    $firewallName = "Cloud Gaming - Parsec Host UDP"    Get-NetFirewallRule -DisplayName $firewallName -ErrorAction SilentlyContinue | Remove-NetFirewallRule    New-NetFirewallRule -DisplayName $firewallName -Direction Inbound -Protocol UDP -LocalPort 8000-8010 -Action Allow | Out-Null    Write-Host "Windows Firewall rule installed: $firewallName"    Write-Host "If this machine is in Azure, also allow inbound UDP 8000-8010 on its Network Security Group." -ForegroundColor Yellow    if ($provisionParsec) {        $parsecAuthFile = Join-Path $parsecDataDirectory "user.bin"        $authDeadline = (Get-Date).AddMinutes(2)        while ((Get-Date) -lt $authDeadline -and -not (Test-Path -LiteralPath $parsecAuthFile)) {            Start-Sleep -Seconds 5        }        if (Test-Path -LiteralPath $parsecAuthFile) {            Write-Host "Parsec Team authentication file was created."        }        else {            throw "Parsec installed, but Team authentication was not created within 2 minutes. Check C:\Program Files\Parsec\install.log and C:\ProgramData\Parsec\log.txt on the runner."        }    }    if ($SkipSteam) {        Write-Step "Skipping Steam installation"    }    else {        Write-Step "Installing Steam"        $steamExe = "C:\Program Files (x86)\Steam\steam.exe"        if (Test-Path -LiteralPath $steamExe) {            Write-Host "Steam is already installed; skipping installer."        }        else {            $steamInstaller = Join-Path $env:TEMP "SteamSetup.exe"            Invoke-Download -Uri $SteamDownloadUrl -Destination $steamInstaller            Invoke-Installer -Path $steamInstaller -Arguments @("/S")            Start-Sleep -Seconds 10        }    }    $hasAutoLoginUser = -not [string]::IsNullOrWhiteSpace($AutoLoginUser)    $hasAutoLoginPass = ($null -ne $AutoLoginPass -and $AutoLoginPass.Length -gt 0)    if ($hasAutoLoginUser -ne $hasAutoLoginPass) {        throw "AutoLoginUser and AutoLoginPass must be supplied together."    }    if ($hasAutoLoginUser) {        Write-Step "Configuring Windows auto-login"        $bstr = [IntPtr]::Zero        $plainPassword = $null        try {            $bstr = [Runtime.InteropServices.Marshal]::SecureStringToBSTR($AutoLoginPass)            $plainPassword = [Runtime.InteropServices.Marshal]::PtrToStringBSTR($bstr)            Protect-SensitiveValue $plainPassword            $winlogon = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon"            Set-ItemProperty -Path $winlogon -Name "AutoAdminLogon" -Value "1"            Set-ItemProperty -Path $winlogon -Name "DefaultUserName" -Value $AutoLoginUser            Set-ItemProperty -Path $winlogon -Name "DefaultPassword" -Value $plainPassword            Remove-ItemProperty -Path $winlogon -Name "AutoLogonCount" -ErrorAction SilentlyContinue            Write-Host "Auto-login configured for $AutoLoginUser."            Write-Host "Windows stores auto-login passwords in the registry. Use a unique password." -ForegroundColor Yellow        }        finally {            if ($bstr -ne [IntPtr]::Zero) {                [Runtime.InteropServices.Marshal]::ZeroFreeBSTR($bstr)            }            $plainPassword = $null        }    }    if ($IdleShutdownMinutes -gt 0) {        Write-Step "Installing idle-shutdown watchdog"        $watchdog = @'$idleLimitSeconds = IDLE_MINUTES * 60$idleFile = "C:\cloudgaming-idle.txt"function Test-ActiveSession {    $queryOutput = @(quser 2>$null)    if ($LASTEXITCODE -eq 0 -and $queryOutput.Count -gt 1) {        foreach ($line in ($queryOutput | Select-Object -Skip 1)) {            if ($line -match "\sActive\s") { return $true }        }    }    $parsecProcesses = @(Get-Process -Name "parsecd" -ErrorAction SilentlyContinue)    foreach ($process in $parsecProcesses) {        $endpoints = @(Get-NetUDPEndpoint -OwningProcess $process.Id -ErrorAction SilentlyContinue)        if ($endpoints.Count -gt 2) { return $true }    }    return $false}if (Test-ActiveSession) {    "0" | Out-File -LiteralPath $idleFile -Force}else {    $idleSeconds = 0    if (Test-Path -LiteralPath $idleFile) {        $idleSeconds = [int](Get-Content -LiteralPath $idleFile -TotalCount 1)    }    $idleSeconds += 300    "$idleSeconds" | Out-File -LiteralPath $idleFile -Force    if ($idleSeconds -ge $idleLimitSeconds) {        shutdown.exe /s /t 60 /c "Cloud gaming VM idle - shutting down to save money"    }}'@        $watchdog = $watchdog -replace "IDLE_MINUTES", [string]$IdleShutdownMinutes        $watchdogPath = "C:\cloudgaming-watchdog.ps1"        $watchdog | Set-Content -LiteralPath $watchdogPath -Encoding UTF8        $taskName = "CloudGamingIdleWatchdog"        Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue |            Unregister-ScheduledTask -Confirm:$false        $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$watchdogPath`""        $trigger = New-ScheduledTaskTrigger -Once -At ((Get-Date).AddMinutes(1)) -RepetitionInterval (New-TimeSpan -Minutes 5) -RepetitionDuration (New-TimeSpan -Days 3650)        $principal = New-ScheduledTaskPrincipal -UserId "SYSTEM" -LogonType ServiceAccount -RunLevel Highest        $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit ([TimeSpan]::Zero)        Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -Principal $principal -Settings $settings | Out-Null        Write-Host "Idle watchdog installed. It checks every 5 minutes and shuts down after $IdleShutdownMinutes idle minutes."    }    else {        Write-Step "Idle-shutdown watchdog disabled"        Get-ScheduledTask -TaskName "CloudGamingIdleWatchdog" -ErrorAction SilentlyContinue |            Unregister-ScheduledTask -Confirm:$false    }    Write-Step "SETUP COMPLETE"    Write-Host "Parsec is installed in per-computer/shared host mode." -ForegroundColor Green    if ($provisionParsec) {        Write-Host "Parsec Team provisioning was requested. Confirm the machine appears in the Parsec admin portal." -ForegroundColor Green    }    else {        Write-Host "No Parsec Team credentials were supplied; sign in manually once through the Parsec app." -ForegroundColor Yellow    }    Write-Host "Setup log: $script:LogFile"}catch {    Write-Host ""    Write-Host "ERROR: $($_.Exception.Message)" -ForegroundColor Red    exit 1}finally {    if ($script:TranscriptStarted) {        Stop-Transcript | Out-Null    }}
