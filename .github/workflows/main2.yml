name: VR Gaming PC

on:
  workflow_dispatch:

jobs:
  configure-gpu-pc:
    runs-on: self-hosted
    timeout-minutes: 720

    env:
      STEAM_USER: ${{ secrets.STEAM_USER }}
      STEAM_PASS: ${{ secrets.STEAM_PASS }}

    steps:
      - name: Verify NVIDIA GPU
        shell: powershell
        run: |
          $gpu = Get-CimInstance Win32_VideoController | Where-Object { $_.Name -match "NVIDIA" }
          if (-not $gpu) { Write-Error "No NVIDIA GPU detected."; exit 1 }
          nvidia-smi
          Write-Host "GPU OK: $($gpu.Name)"

      - name: Install latest NVIDIA driver
        shell: powershell
        run: |
          winget install --id Nvidia.Driver --accept-source-agreements --accept-package-agreements -h --force
          # A reboot may be required after driver updates — the runner
          # service auto-restarts and you can re-run the workflow.

      - name: Install Steam and SteamCMD
        shell: powershell
        run: |
          winget install --id Valve.Steam --accept-source-agreements --accept-package-agreements -h --force
          winget install --id Valve.SteamCMD --accept-source-agreements --accept-package-agreements -h --force

      - name: Install SteamVR and VRChat
        shell: powershell
        run: |
          $steamcmd = "C:\steamcmd\steamcmd.exe"
          & $steamcmd +login $env:STEAM_USER $env:STEAM_PASS `
            +app_update 250820 validate `
            +app_update 438100 validate `
            +quit

      - name: Install Parsec
        shell: powershell
        run: |
          winget install --id Parsec.Parsec -h --force

      - name: Launch Steam and SteamVR
        shell: powershell
        run: |
          $steam = "C:\Program Files (x86)\Steam\steam.exe"
          Start-Process $steam -ArgumentList "-applaunch 250820"  # 250820 = SteamVR
          Start-Sleep -Seconds 90
          Write-Host "SteamVR running — connect from your headset via Virtual Desktop."

      - name: Keep session alive
        shell: powershell
        run: |
          $start = Get-Date
          while ((New-TimeSpan -Start $start -End (Get-Date)).TotalHours -lt 12) {
            (New-Object -ComObject WScript.Shell).SendKeys('{F15}')  # prevent idle sleep
            Write-Host "[$(Get-Date)] Session alive"
            Start-Sleep -Seconds 300
          }
